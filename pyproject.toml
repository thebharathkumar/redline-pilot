[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-pilot"
version = "0.1.0"
description = "First-pass NDA review that writes Word tracked changes and comments."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.2",
    "lxml",
    "pydantic>=2",
    "PyYAML",
    "anthropic",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools]
packages = ["redline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
